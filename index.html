<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detective Doggo Adventure</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.1/lib/p5.js"></script>
  <script src="sketch.js"></script>
  <style>
    body {
      padding: 0;
      margin: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #1E1E1E;
      color: #FFFFFF;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    .button-container {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .game-button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: block;
      font-size: 16px;
      margin: 4px 0;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 80%;
      max-width: 300px;
    }
    .game-button:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }
  </style> 
</head>
<body>
</body>
</html>
